<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToDo-List</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&family=Oxanium:wght@200..800&display=swap"
        rel="stylesheet">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    </head>
</head>

<body>
    <header>
        <div class="left"><img src="logo.png" alt=""></div>
        <div class="center">
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
        </div>
        <div class="right">
            <button class="shift" id="shift">Dark</button>
        </div>
    </header>
    <div class="main">
        
        <div class="container">
            <h1>ToDo-List 📝</h1>
            <div class="inputContainer">
                <input type="text" name="taskInput" id="taskInput" placeholder="Add your task">
                <button id="addTaskBtn">+</button>
            </div>
            <p id="successmsg"></p>
            <ul id="taskList"></ul>
        </div>
        <script src="script.js"></script>
    </div>
</body>

</html>
